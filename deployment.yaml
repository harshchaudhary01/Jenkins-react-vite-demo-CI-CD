apiVersion: apps/v1

kind: Deployment

metadata:
  name: react-vite-docker-k8s

spec:
  replicas: 2

  selector:
    matchLabels:
      app: react-vite-docker-k8s

  template:
    metadata:
      labels:
        app: react-vite-docker-k8s
    spec:
      containers:
        - name: react-vite-docker-k8s
          image: react-vite-image
          ports:
            - containerPort: 5173